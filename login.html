<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SafeReport</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .login-container {
            min-height: 80vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }

        .login-card {
            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .login-card h1 {
            margin-bottom: 10px;
        }

        .login-card p {
            color: #777;

            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;
        }

        .input-group input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;
        }

        .login-submit {
            width: 100%;

            border: none;

            padding: 14px;

            background: #d9412f;

            color: white;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-submit:hover {
            background: #b83224;
        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">

        <div class="logo-icon">
            🛡️
        </div>

        <span>SafeReport</span>

    </div>

    <div class="nav-links">

        <a href="index.html">
            🏠 Home
        </a>

        <a href="report.html">
            📝 Report
        </a>

        <a href="track.html">
            🔍 Track
        </a>

    </div>

</nav>


<div class="login-container">

    <div class="login-card">

        <h1>Welcome Back</h1>

        <p>
            Login to manage your reports.
        </p>


        <form onsubmit="loginUser(event)">

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                class="login-submit"
                type="submit">

                Login

            </button>

        </form>

    </div>

</div>


<script>

function loginUser(event) {

    event.preventDefault();

    alert("Demo login successful!");

}

</script>


</body>

</html>
